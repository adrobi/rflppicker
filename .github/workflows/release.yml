name: release

# A pushed tag v1.2.3 builds the Windows and Linux archives from pinned
# versions and publishes the release with the CHANGELOG section of the version.
# Started by hand, it only builds: the archives are kept as run artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The version tag in the archive names; "trial" for a build started by hand.
  BUILD_NAME: ${{ github.event_name == 'push' && github.ref_name || 'trial' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the version, changelog and READMEs
        run: |
          if [[ "$BUILD_NAME" == trial ]]; then
            python tools/release_notes.py --check
          else
            python tools/release_notes.py --check "$BUILD_NAME"
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      # build_windows.ps1 prefers the project environment .venv.
      - name: Install the pinned build dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-build.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -X faulthandler -m unittest discover
      - name: Build
        shell: pwsh
        run: .\build_windows.ps1
      - name: Verify the packaged program and NCBI access
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = 'dist\RFLP-Picker\RFLP-Picker.exe'
          $window = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($window.HasExited) { throw "The program exited with code $($window.ExitCode)" }
          Stop-Process -Id $window.Id
          foreach ($checkArg in @('--check-runtime', '--check-ncbi')) {
            $log = Join-Path $PWD "$checkArg.log"
            $check = Start-Process $exe -ArgumentList $checkArg, ('"--check-log={0}"' -f $log) -Wait -PassThru
            if (Test-Path $log) { Get-Content -Encoding utf8 $log }
            if ($check.ExitCode -ne 0) { throw "$checkArg failed with code $($check.ExitCode)" }
          }
      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path dist\RFLP-Picker -DestinationPath "RFLP-Picker-$env:BUILD_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: RFLP-Picker-*-windows-x64.zip

  linux:
    needs: check
    # An older system: the build then runs on newer ones too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth
      # build_linux.sh prefers the project environment .venv.
      - name: Install the pinned build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-build.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -X faulthandler -m unittest discover
      - name: Build
        run: ./build_linux.sh
      - name: Verify the packaged program and NCBI access
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          code=0
          xvfb-run -a timeout 10 dist/RFLP-Picker/RFLP-Picker || code=$?
          test "$code" -eq 124
          xvfb-run -a dist/RFLP-Picker/RFLP-Picker --check-runtime
          dist/RFLP-Picker/RFLP-Picker --check-ncbi
      - name: Pack
        run: tar -C dist -czf "RFLP-Picker-$BUILD_NAME-linux-x86_64.tar.gz" RFLP-Picker
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: RFLP-Picker-*-linux-x86_64.tar.gz

  publish:
    # Only a pushed tag publishes; a run started by hand never does, whatever ref it was given.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}   # a tag name; passed through the environment, not into the script
        run: |
          python tools/release_notes.py "$TAG" RFLP-Picker-*-windows-x64.zip RFLP-Picker-*-linux-x86_64.tar.gz > notes.md
          gh release create "$TAG" RFLP-Picker-*-windows-x64.zip RFLP-Picker-*-linux-x86_64.tar.gz \
            --verify-tag --title "RFLP Picker ${TAG#v}" --notes-file notes.md
