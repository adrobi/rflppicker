name: release

# A pushed tag v1.2.3 builds the Windows archive and attaches it to a draft
# release; the draft is checked and published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      # build_windows.ps1 prefers the project environment .venv.
      - name: Install the pinned build dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-build.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -X faulthandler -m unittest discover
      - name: Build
        shell: pwsh
        run: .\build_windows.ps1
      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path dist\RFLP-Picker -DestinationPath "RFLP-Picker-${{ github.ref_name }}-windows.zip"
      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "RFLP-Picker-${{ github.ref_name }}-windows.zip"
          --draft --verify-tag --title "RFLP Picker $("${{ github.ref_name }}".TrimStart('v'))"
          --notes "See CHANGELOG.md."
